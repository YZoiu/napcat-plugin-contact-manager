name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.0.0'
        required: false
        default: ''

permissions:
  contents: write
  actions: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="v$(node -p "require('./package.json').version")"
          fi

          CLEAN_VERSION="${VERSION#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "clean_version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install

      - name: Install WebUI dependencies
        run: cd src/webui && pnpm install

      - name: Set package version
        run: npm version ${{ steps.version.outputs.clean_version }} --no-git-tag-version --allow-same-version

      - name: Build
        run: pnpm run build

      - name: Pack plugin
        run: |
          PLUGIN_ID="napcat-plugin-contact-manager"
          mkdir -p release
          cp dist/index.mjs release/
          cp dist/package.json release/
          cp -r dist/webui release/
          cd release
          zip -r "../${PLUGIN_ID}.zip" index.mjs package.json webui

      - name: Verify package
        run: unzip -l napcat-plugin-contact-manager.zip

      - name: Generate release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [ -f ".github/prompt/default.md" ]; then
            sed "s/{VERSION}/$VERSION/g" .github/prompt/default.md > CHANGELOG.md
          else
            printf '## %s\n\n### Changes\n- Release package updated.\n' "$VERSION" > CHANGELOG.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          files: napcat-plugin-contact-manager.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger index update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'update-index.yml',
              ref: 'main',
              inputs: {
                version: '${{ steps.version.outputs.version }}'
              }
            })
